[package]
name = "jjfsd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
fuser = "0.18.0"
futures = "0.3.33"
itertools = "0.15.0"
jj-lib = "0.43.0"
libc = "0.2.189"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ustr = "1.1.0"
pollster = "0.4.0"

[dev-dependencies]
tempfile = "3"

